name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to a Flutter release compatible with the project's
      # Android Gradle Plugin 8.1.4 / Gradle 8.2 configuration.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      # The project has a hyphenated name which Flutter rejects.
      # We need to temporarily fix the package name for Android.
      - name: Fix package name for Android
        run: |
          set -e
          
          echo "Fixing project structure..."
          
          # Temporarily rename the package in pubspec.yaml
          # Create a backup
          cp pubspec.yaml pubspec.yaml.bak
          
          # Change the package name to valid format
          sed -i 's/^name: modi-fire-safety-app$/name: modi_fire_safety_app/' pubspec.yaml
          sed -i 's/name: modi-fire-safety-app/name: modi_fire_safety_app/' pubspec.yaml
          
          echo "Package name fixed"

      # Flutter needs gradlew and gradle-wrapper.jar - copy from Flutter SDK template
      - name: Generate Gradle wrapper
        run: |
          set -e
          
          echo "Generating Gradle wrapper..."
          
          mkdir -p android/gradle/wrapper
          
          # Download the gradle-wrapper.jar from a known working version
          curl -L "https://repo1.maven.org/maven2/org/gradle/gradle-wrapper/8.2/gradle-wrapper-8.2.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar
          
          # Verify download
          ls -la android/gradle/wrapper/gradle-wrapper.jar
          file android/gradle/wrapper/gradle-wrapper.jar
          
          # Create gradlew script
          cat > android/gradlew << 'SCRIPT'
          #!/usr/bin/env sh
          APP_BASENAME=$(basename "$0")
          APP_ROOT=$(cd "$(dirname "$0")" && pwd)
          export GRADLE_USER_HOME="/home/runner/.gradle"
          exec java -Xmx2g -XX:MaxMetaspaceSize=512m \
            -classpath "$APP_ROOT/android/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          SCRIPT
          chmod +x android/gradlew
          
          # Update gradle-wrapper.properties
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          echo "Gradle wrapper created"
          ls -la android/

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: modi-fire-safety-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
EOF