name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to a Flutter release compatible with the project's
      # Android Gradle Plugin 8.1.4 / Gradle 8.2 configuration.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      # The repository does not contain gradlew or gradle-wrapper.jar.
      # Download the Gradle wrapper jar from official distribution and create gradlew script.
      - name: Download Gradle wrapper
        run: |
          set -e
          mkdir -p android/gradle/wrapper
          
          # Download gradle-wrapper.jar from the Gradle GitHub release assets
          # This URL points directly to the wrapper jar in the gradle distribution
          echo "Downloading gradle-wrapper.jar..."
          
          # Method 1: Try raw GitHub content
          curl -L --retry 3 --retry-delay 5 \
            -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar" 2>/dev/null || true
          
          # Verify the jar is valid (should have a valid JAR header)
          if ! file android/gradle/wrapper/gradle-wrapper.jar | grep -q "ZIP"; then
            echo "Primary URL failed, trying alternative..."
            
            # Method 2: Extract from gradle distribution
            cd /tmp
            curl -L -o gradle-bin.zip \
              "https://services.gradle.org/distributions/gradle-8.2-bin.zip"
            unzip -q gradle-bin.zip
            cp gradle-8.2/lib/plugins/gradle-wrapper-8.2.jar \
              "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"
            cd "$GITHUB_WORKSPACE"
          fi
          
          # Verify the jar was downloaded correctly
          if [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle-wrapper.jar is empty or missing"
            exit 1
          fi
          echo "gradle-wrapper.jar size: $(stat -c%s android/gradle/wrapper/gradle-wrapper.jar) bytes"
          
          # Create gradlew script
          cat > android/gradlew << 'SCRIPT'
          #!/usr/bin/env sh
          APP_BASENAME=$(basename "$0")
          APP_ROOT=$(cd "$(dirname "$0")" && pwd)
          export GRADLE_USER_HOME="/home/runner/.gradle"
          exec java -Xmx2g -XX:MaxMetaspaceSize=512m \
            -classpath "$APP_ROOT/android/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          SCRIPT
          chmod +x android/gradlew

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: modi-fire-safety-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error