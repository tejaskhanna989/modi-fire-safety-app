name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      # The repo lacks android/gradlew and gradle-wrapper.jar. Generate a
      # scratch project with flutter create (valid package name) and copy
      # ONLY the missing wrapper files. Existing Android code is not touched.
      - name: Add missing Gradle wrapper files
        run: |
          set -e
          flutter create --platforms=android --org com.modifire --project-name modi_fire_safety /tmp/wrapper_src
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar; do
            if [ ! -f "android/$f" ]; then
              mkdir -p "android/$(dirname "$f")"
              cp "/tmp/wrapper_src/android/$f" "android/$f"
              echo "Added android/$f"
            fi
          done
          chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      # android/build.gradle overrides buildDir, so the APK is not always under
      # build/. Locate it and copy it to a fixed folder for publishing.
      - name: Locate release APK
        run: |
          set -e
          apk=$(find . -name 'app-release.apk' -not -path './.git/*' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::app-release.apk not found"
            exit 1
          fi
          echo "Found APK at: $apk"
          mkdir -p release-apk
          cp "$apk" release-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: modi-fire-safety-release-apk
          path: release-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          cp release-apk/app-release.apk "modi-fire-safety-${TAG}.apk"
          gh release create "$TAG" "modi-fire-safety-${TAG}.apk" \
            --prerelease \
            --title "Modi Fire Safety ${TAG}" \
            --notes "Release APK built from commit ${{ github.sha }} (branch ${{ github.ref_name }})." \
            --target "${{ github.sha }}"
# Build trigger
