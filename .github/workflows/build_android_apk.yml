name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to a Flutter release compatible with the project's
      # Android Gradle Plugin 8.1.4 / Gradle 8.2 configuration.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      # The repository does not contain gradlew or gradle-wrapper.jar.
      # Flutter will create necessary files automatically during build.
      # Do NOT run `flutter create` because the project name has hyphens
      # (which are invalid as Darwin package names and would fail).
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests (non-blocking)
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: modi-fire-safety-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error