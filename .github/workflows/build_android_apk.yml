name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to a Flutter release compatible with the project's
      # Android Gradle Plugin 8.1.4 / Gradle 8.2 configuration.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      # The repository does not contain gradlew or gradle-wrapper.jar.
      # Download the correct gradle-wrapper.jar from Maven Central (official Gradle wrapper)
      - name: Download Gradle wrapper
        run: |
          set -e
          mkdir -p android/gradle/wrapper
          
          echo "Downloading Gradle wrapper jar from Maven Central..."
          
          # Download the gradle-wrapper.jar from Maven Central
          # This is the official Gradle wrapper bootstrap jar
          curl -L --retry 3 --retry-delay 5 \
            "https://repo1.maven.org/maven2/org/gradle/gradle-wrapper/8.2/gradle-wrapper-8.2.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar
          
          # Verify download
          JAR_SIZE=$(stat -c%s android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0)
          echo "gradle-wrapper.jar size: ${JAR_SIZE} bytes"
          
          if [ "$JAR_SIZE" -lt 10000 ]; then
            echo "ERROR: gradle-wrapper.jar appears corrupted"
            exit 1
          fi
          
          # Create gradlew script
          cat > android/gradlew << 'SCRIPT'
          #!/usr/bin/env sh
          APP_BASENAME=$(basename "$0")
          APP_ROOT=$(cd "$(dirname "$0")" && pwd)
          export GRADLE_USER_HOME="/home/runner/.gradle"
          exec java -Xmx2g -XX:MaxMetaspaceSize=512m \
            -classpath "$APP_ROOT/android/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          SCRIPT
          chmod +x android/gradlew

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: modi-fire-safety-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
EOF