name: Deploy customer website

on:
  push:
    branches:
      - main
      - arena/bb8c7dae-modi-fire-safety-app
    paths:
      - 'website/**'
      - '.github/workflows/deploy_website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Stage site and check entry point
        run: |
          rm -rf _site
          mkdir _site
          cp -R website/. _site/
          test -f _site/index.html || { echo "index.html missing from staged site"; exit 1; }
          echo "Staged files:"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
